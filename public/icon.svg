<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#131e3d" />
      <stop offset="60%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#04060e" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="divineGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.6" />

  <!-- Sacred Lotus Petals / Chakra Rays -->
  <g transform="translate(256, 256)">
    <!-- 12 Radiating rays -->
    <g opacity="0.35">
      <line x1="0" y1="-180" x2="0" y2="-150" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="90" y1="-155" x2="75" y2="-130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="155" y1="-90" x2="130" y2="-75" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="180" y1="0" x2="150" y2="0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="155" y1="90" x2="130" y2="75" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="90" y1="155" x2="75" y2="130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="180" x2="0" y2="150" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="-90" y1="155" x2="-75" y2="130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="-155" y1="90" x2="-130" y2="75" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="-180" y1="0" x2="-150" y2="0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="-155" y1="-90" x2="-130" y2="-75" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="-90" y1="-155" x2="-75" y2="-130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Glowing central aura -->
    <circle cx="0" cy="0" r="110" fill="url(#divineGlow)" opacity="0.3" filter="url(#glow)" />

    <!-- Sacred Scripture / Diya Flame & Lotus Motif -->
    <!-- Open Book / Scripture leaves -->
    <path d="M-80,45 C-45,35 -15,48 0,60 C15,48 45,35 80,45 C70,10 40,-5 0,0 C-40,-5 -70,10 -80,45 Z" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Outer Lotus Petals -->
    <path d="M0,30 C-35,10 -75,-20 -70,-70 C-50,-75 -20,-45 0,-10 C20,-45 50,-75 70,-70 C75,-20 35,10 0,30 Z" fill="url(#goldGrad)" />
    
    <!-- Central Peacock Feather Eye / Flame of Wisdom -->
    <ellipse cx="0" cy="-55" rx="26" ry="40" fill="#0e7490" stroke="url(#goldGrad)" stroke-width="4" />
    <ellipse cx="0" cy="-50" rx="16" ry="26" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3" />
    <circle cx="0" cy="-45" r="9" fill="#fbbf24" filter="url(#glow)" />
    
    <!-- Flute silhouette across the bottom -->
    <path d="M-115,75 C-40,65 40,65 115,75 L115,83 C40,73 -40,73 -115,83 Z" fill="url(#goldGrad)" />
    <circle cx="-90" cy="79" r="2.5" fill="#131e3d" />
    <circle cx="-60" cy="79" r="2.5" fill="#131e3d" />
    <circle cx="-30" cy="79" r="2.5" fill="#131e3d" />
    <circle cx="0" cy="79" r="2.5" fill="#131e3d" />
    <circle cx="30" cy="79" r="2.5" fill="#131e3d" />
    <circle cx="60" cy="79" r="2.5" fill="#131e3d" />
    <circle cx="90" cy="79" r="2.5" fill="#131e3d" />

    <!-- Sanskrit Om signet subtly inscribed -->
    <text x="0" y="22" font-family="serif" font-size="28" font-weight="bold" fill="#060913" text-anchor="middle">ॐ</text>
  </g>
</svg>

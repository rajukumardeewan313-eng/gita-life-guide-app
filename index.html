    <!-- AI Studio Sandbox: HMR WebSocket Guard (HMR is disabled in this environment) -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (
            (typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket closed without opened')) ||
            (typeof event.reason === 'string' && event.reason.includes('WebSocket closed without opened'))
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (event.message && event.message.includes('WebSocket closed without opened')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        if (window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          var MockWebSocket = function(url, protocols) {
            var isVite = (protocols === 'vite-hmr' || protocols === 'vite-ping') ||
                         (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/')));
            if (isVite) {
              var target = new EventTarget();
              target.readyState = 1;
              target.OPEN = 1;
              target.CLOSED = 3;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.send = function() {};
              target.close = function() {};
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch (_) {}
              }, 0);
              return target;
            }
            return new RealWebSocket(url, protocols);
          };
          MockWebSocket.prototype = RealWebSocket.prototype;
          MockWebSocket.OPEN = RealWebSocket.OPEN;
          MockWebSocket.CLOSED = RealWebSocket.CLOSED;
          MockWebSocket.CONNECTING = RealWebSocket.CONNECTING;
          MockWebSocket.CLOSING = RealWebSocket.CLOSING;
          window.WebSocket = MockWebSocket;
        }
      })();
    </script>
